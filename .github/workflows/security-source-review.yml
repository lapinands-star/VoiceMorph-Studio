name: Security source line inventory
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Scan every tracked text-source line
        run: python3 scripts/security_source_scan.py --output security-source-scan.json
      - name: Save full evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-source-scan
          path: security-source-scan.json
          if-no-files-found: error
